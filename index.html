
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض خاص للموظفين</title>
<style>
body {
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f4f6;
  text-align: center;
  padding: 30px 15px;
}
.card {
  background: white;
  max-width: 420px;
  margin: 50px auto;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 4px 15px #0002;
}
h2 { color: #b51f24; }
button {
  background: #b51f24;
  color: white;
  border: 0;
  padding: 14px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}
#notice {
  display: none;
  margin-top: 25px;
  padding: 15px;
  background: #fff3cd;
  border-radius: 8px;
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="card">
  <h2>تقديرًا لجهود موظفي سمة المميزين</h2>
  <h3>  بالتعاون مع مكتبة جرير، تم تخصيص خصومات تصل إلى 40% لأول  10 موظفين! 🎁</h3>
  <p>سيتم إغلاق نموذج التسجيل خلال 48 ساعة</p>

  <button onclick="showNotice()">
    استكشف العرض
  </button>

  <div id="notice">
    <h3>🛡️ لقد اكتملت المحاكاة!</h3>
    <p>
      هذا اختبار توعوي للتصيد الإلكتروني.
      تذكر دائماً التحقق من مصدر الرسائل
      والروابط قبل الضغط عليها.
    </p>
  </div>
</div>

<script>
function showNotice() {
  document.getElementById("notice").style.display = "block";
}
</script>

</body>
</html>
